name: CI

on:
  push:
    branches: [dev, "feature/**"]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit and integration tests (SQLite, local files)
        run: pytest -q

  # The production combination: Postgres as the least-privilege app role, files through the R2 adapter.
  production-like:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on Postgres + R2 adapter
        run: pytest -q
        env:
          PIXELRELAY_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PIXELRELAY_TEST_STORAGE: r2

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Browser journey (headless Chrome)
        run: node tests/e2e/journey.mjs
        env:
          PYTHON: python
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: tests/e2e/out/

  # Builds the same image Cloudflare will run, boots it, and checks the Worker config bundles.
  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t pixelrelay:ci .
      - name: Boot it and call /healthz
        run: |
          docker run -d --name pr -p 8000:8000 -e SECRET_KEY=ci-only-secret-0123456789abcdef0123 pixelrelay:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; docker rm -f pr; exit 0; fi
            sleep 1
          done
          docker logs pr; exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Worker + container config (dry run, nothing is uploaded)
        run: npx --yes wrangler@4.152.0 deploy --dry-run --outdir dist
