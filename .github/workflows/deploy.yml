name: Deploy

# Deploys the Worker and builds/pushes the container image to Cloudflare on every push to main
# (main only changes through the dev -> main PR). Building the image needs Docker, which the runner has.
# Needs the Actions secret CLOUDFLARE_API_TOKEN (progress.md, step 5). App secrets are set on the Worker
# with `wrangler secret put` and are not touched here.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Cloudflare token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN Actions secret first (progress.md, step 5)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Deploy (Worker + container image)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.152.0 deploy
